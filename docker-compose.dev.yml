name: gymhub-dev

x-api-env: &api-env
  APP_ENV: development
  PORT: 8082
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET}
  JWT_ISSUER: ${JWT_ISSUER}
  JWT_AUDIENCE: ${JWT_AUDIENCE}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
  VIETQR_BANK_ID: ${VIETQR_BANK_ID:-}
  VIETQR_ACCOUNT_NO: ${VIETQR_ACCOUNT_NO:-}
  VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME:-}
  SEED_DEMO: ${SEED_DEMO:-true}
  SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-Demo@12345}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  migrate:
    build:
      context: ${BACKEND_DIR:-../demogymhub-Backend}
    image: gymhub-api:dev
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/seed.js"]
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: gymhub-api:dev
    restart: unless-stopped
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "3002:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy-api.inc:/etc/nginx/conf.d/proxy-api.inc:ro
      - ${FRONTEND_DIST:-../demogymhub-Frontend/apps/admin/dist}:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
